<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430">
    <rect width="720" height="430" fill="white"/>
    <g font-family="Arial, sans-serif" fill="#0f172a">
      <text x="20" y="35" font-size="20" font-weight="bold" fill="#b91c1c">Before: overlap increases</text>
        <text x="20" y="65" font-size="15">move R2 0.8mm down</text>
        <text x="20" y="88" font-size="14">R2: 2.8mm inside bottom edge</text>
        <rect x="65" y="100" width="220" height="220" rx="4" fill="#f8fafc" stroke="#64748b"/>
        <text x="175" y="119" text-anchor="middle" font-size="12">TOP: Y = +5</text>
        <text x="175" y="309" text-anchor="middle" font-size="12">BOTTOM: Y = -5</text>
        <path d="M 80 154 L 80 126 L 76 132 M 80 126 L 84 132" fill="none" stroke="#475569"/>
        <text x="86" y="146" font-size="12">+Y</text>
        <line x1="65" y1="210" x2="285" y2="210" stroke="#cbd5e1" stroke-dasharray="3 3"/>
        <rect x="164" y="188" width="22" height="44" fill="#dbeafe" stroke="#2563eb" />
        <rect x="164" y="161.6" width="22" height="44" fill="none" stroke="#64748b" stroke-dasharray="3 3"/>
        <rect x="164" y="179.2" width="22" height="44" fill="#a7f3d0" stroke="#059669" fill-opacity="0.65"/>
        <rect x="164" y="188" width="22" height="35.2" fill="#fca5a5" stroke="#dc2626" fill-opacity="0.85"/>
        <text x="125" y="222" font-size="13" fill="#2563eb">R1</text>
        <text x="195" y="206.2" font-size="13" fill="#047857">R2</text>
        <path d="M 240 183.6 L 240 201.2 L 236 195.2 M 240 201.2 L 244 195.2" fill="none" stroke="#b91c1c" stroke-width="2"/>
        <text x="20" y="355" font-size="16" fill="#b91c1c">Overlap after move: 1.6mm</text>
        <text x="20" y="380" font-size="13">R2 center Y: 0.4mm</text>
      <g transform="translate(360 0)"><text x="20" y="35" font-size="20" font-weight="bold" fill="#047857">After: overlap removed</text>
        <text x="20" y="65" font-size="15">move R2 0.8mm up</text>
        <text x="20" y="88" font-size="14">R2: 2.8mm inside top edge</text>
        <rect x="65" y="100" width="220" height="220" rx="4" fill="#f8fafc" stroke="#64748b"/>
        <text x="175" y="119" text-anchor="middle" font-size="12">TOP: Y = +5</text>
        <text x="175" y="309" text-anchor="middle" font-size="12">BOTTOM: Y = -5</text>
        <path d="M 80 154 L 80 126 L 76 132 M 80 126 L 84 132" fill="none" stroke="#475569"/>
        <text x="86" y="146" font-size="12">+Y</text>
        <line x1="65" y1="210" x2="285" y2="210" stroke="#cbd5e1" stroke-dasharray="3 3"/>
        <rect x="164" y="188" width="22" height="44" fill="#dbeafe" stroke="#2563eb" />
        <rect x="164" y="161.6" width="22" height="44" fill="none" stroke="#64748b" stroke-dasharray="3 3"/>
        <rect x="164" y="144" width="22" height="44" fill="#a7f3d0" stroke="#059669" fill-opacity="0.65"/>
        
        <text x="125" y="222" font-size="13" fill="#2563eb">R1</text>
        <text x="195" y="171" font-size="13" fill="#047857">R2</text>
        <path d="M 240 183.6 L 240 166 L 236 172 M 240 166 L 244 172" fill="none" stroke="#047857" stroke-width="2"/>
        <text x="20" y="355" font-size="16" fill="#047857">Overlap after move: 0.0mm</text>
        <text x="20" y="380" font-size="13">R2 center Y: 2.0mm</text></g>
      <text x="360" y="415" text-anchor="middle" font-size="13">Dashed outline: original R2 position; red: overlap after movement</text>
    </g>
  </svg>